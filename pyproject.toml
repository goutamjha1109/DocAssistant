[build-system]

requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-curator"

version = "0.1.0"

requires-python = ">=3.10"

dependencies = [
    "arxiv",
    "requests",
    "pydantic-settings",
    "pymupdf",
    "tiktoken",
    "openai",
    "sentence-transformers",
    "qdrant-client",
    "groq",
]

[tool.setuptools.packages.find]
where = ["src"]